<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot</title>
</head>
<body>
<div class="js-container"></div>



<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>


<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>


<script type="text/babel">

  function ChatInput(){


    return (
      <>
        <input placeholder="Send a message to the bot" size="50" />
        <button>Send</button>
      </>
    );
  }

  function ChatMessage({message, sender}) {
    // const {sender} = props
    // const {message} =  props;
    // const {message, sender } = props



    return (

      <div>
          {sender === 'robot' && (<img src="robot.png" alt="robot photo not found" width="50"/>)}
          {message}
          {sender === 'user' &&<img src="user.png" alt="user photo not found" width="50"/>}


      </div>
    );


  }

  function App(){
    return(
            <>
              <ChatInput/>
              <ChatMessage message = "hello chatbot" sender= "user"/>
              <ChatMessage message = "hello how can i help you" sender= "robot"/>
              <ChatMessage message = "can you get me today's date?" sender= "user"/>
              <ChatMessage message = "today is 21 of may" sender= "robot"/>
            </>
    );
  }


  const container = document.querySelector('.js-container');
  ReactDOM.createRoot(container).render(<App />);

</script>
</body>
</html>
