<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot</title>
</head>
<body>
<div class="js-container"></div>



<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>


<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>


<script type="text/babel">



  function ChatInput({chatMessages, setChatMessages}){

    const [inputText , setInputText] = React.useState('');
    function SaveInputText(event){
      setInputText(event.target.value);



    }

    function sendMessage(){

      setChatMessages([...chatMessages,  {
                message: inputText,
                sender: 'user',
                id: crypto.randomUUID()
              }]

      );

    }

    return (

      <>
        <input placeholder="Send a message to the bot" size="50" onChange={SaveInputText} value = {inputText} />
        <button onClick={sendMessage}>Send</button>
      </>
    );
  }

  function ChatMessage({message, sender}) {


    return (

      <div>
          {sender === 'robot' && (<img src="robot.png" alt="robot photo not found" width="50"/>)}
          {message}
          {sender === 'user' &&<img src="user.png" alt="user photo not found" width="50"/>}


      </div>
    );


  }

  function ChatMessages(){




    return(

      <>

        <button onClick={sendMessage}>Send Message</button>
        {chatMessages.map((chatMessage) => {
              return (
                      <ChatMessage
                              key={chatMessage.id}
                              message={chatMessage.message}
                              sender={chatMessage.sender}
                      />
              )
            })}
      </>

    );

  }

  function App() {

    const [chatMessages, setChatMessages]  = React.useState
    (

            [{
              message: 'hello chatbot',
              sender: 'user',
              id: 'id1'
            }, {
              message: 'hello how can i help you',
              sender: 'robot',
              id: 'id2'
            }, {
              message: 'can you get me today\'s date?',
              sender: 'user',
              id: 'id3'
            }, {
              message: 'today is 21 of may',
              sender: 'robot',
              id: 'id4'
            }]
    );


    return (
            <>
              <ChatInput
                chatMessages={chatMessages}
                setChatMessages ={setChatMessages}

              />
              <ChatMessages />
            </>
    );
  }


  const container = document.querySelector('.js-container');
  ReactDOM.createRoot(container).render(<App />);

</script>
</body>
</html>
